plugins {
    id 'com.android.application'
}

def appVersionName = "2.2.2"

import javax.inject.Inject
// --- Git helper for versionCode and short hash ---
class GitHelper {
    private final ExecOperations execOperations

    @Inject
    GitHelper(ExecOperations execOperations) {
        this.execOperations = execOperations
    }

    int getCommitCount() {
        try {
            def stdout = new ByteArrayOutputStream()
            execOperations.exec { spec ->
                spec.commandLine = ['git', 'rev-list', '--count', 'HEAD']
                spec.standardOutput = stdout
            }
            return Integer.parseInt(stdout.toString().trim())
        } catch (Exception e) {
            return 1
        }
    }
}

// --- Instantiate GitHelper ---
def gitHelper = new GitHelper(services.get(ExecOperations))

android {
    namespace = 'com.smorgasbork.hotdeath'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        targetSdk = 36
        versionCode = gitHelper.getCommitCount()
        versionName = appVersionName
    }

    flavorDimensions = ["version"]
    productFlavors {
        production {
            dimension = "version"
            applicationId = "com.smorgasbork.hotdeath"
            versionName = appVersionName // manual production version
        }
        staging {
            dimension = "version"
            applicationId = "com.smorgasbork.hotdeath.staging"
            versionName = "${appVersionName}-staging"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
            signingConfig = signingConfigs.debug
        }
        debug {
            versionNameSuffix = 'g'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    // Multiplayer: same-room play and the online relay
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub in local unit tests; use the real one there
    testImplementation 'org.json:json:20240303'
}
